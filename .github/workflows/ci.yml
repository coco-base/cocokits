# Manual only (no cost on every PR): the gates format, lint, typecheck, test and build of the affected projects, and
# commitlint of the commits since the base. The same list runs locally with `pnpm ci:local` (tools/scripts/ci-local.mjs).
name: ci

on:
  workflow_dispatch:
    inputs:
      base:
        description: Branch the affected projects and the commits are compared against
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: ${{ inputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Reads the version from the packageManager field of package.json.
      - uses: pnpm/action-setup@v6

      # The Node version is the one in .nvmrc, which satisfies the engines range of package.json.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm exec nx format:check

      # Size limit (500 lines of code) for the Markdown, HTML, CSS and SCSS files outside any Nx project.
      - name: Lint workspace files
        run: pnpm run lint:files

      - name: Lint, typecheck, test, build (affected)
        run: pnpm exec nx affected -t lint typecheck test build --base="origin/$BASE" --head=HEAD

  commits:
    name: commit messages (commits since the base)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: ${{ inputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Commitlint the commits since the base
        run: pnpm exec commitlint --from "origin/$BASE" --to HEAD
