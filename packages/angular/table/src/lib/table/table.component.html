<!-- Just for test -->
<ng-content></ng-content>

<table [ngClass]="classNames().table">

  <thead>
    <ng-container *ngTemplateOutlet="tableHeader()"/>
  </thead>

  <tbody>
    @for (row of (dataSource.change$ | async)?.data; track row; let i = $index) {
      <ng-container *ngTemplateOutlet="tableBody(); context: {
        $implicit: row,
        data: row,
        index: i
      }"/>
    }
  </tbody>

</table>
